[project]
name = "antigravity-session-rescuer"
version = "0.1.0"
description = "Antigravity 2.x 历史会话恢复、标题深度取证与项目树一键修复工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
antigravity-rescuer = "antigravity_rescuer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity_rescuer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
